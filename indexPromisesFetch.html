<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users and Todos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .block {
            width: 300px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .user {
            cursor: pointer;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .user:hover {
            background-color: #f2f2f2;
        }
        .todo {
            font-size: 14px;
            padding: 3px 0;
        }
    </style>
</head>
<body>

<div class="block">
    <h3>Users</h3>
    <div id="users"></div>
</div>

<div class="block">
    <h3>Todos</h3>
    <div id="todos">Select a user</div>
</div>
<script src="PromisesFetch.js"></script>
</body>
</html>
